[project]
name = "wiki-translation-harness"
version = "0.3.0"
description = "Batch tool that translates Wikipedia articles into wikitext for another language edition (built for English to Albanian). Verifies links and templates, validates and repairs the output, and never publishes: a person reviews every file."
requires-python = ">=3.11"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "mwparserfromhell>=0.6.6",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "orjson>=3.10",
    "PyYAML>=6.0",
    "tiktoken>=0.7",
    "langdetect>=1.0.9",
    "googletrans>=4.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
wiki-translation-harness = "wiki_translation_harness.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wiki_translation_harness*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
