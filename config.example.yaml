# Copy to config.yaml and adjust. CLI flags override anything set here.
# OPENROUTER_API_KEY env var overrides openrouter_api_key set here.
# LOCAL_API_KEY env var overrides local_api_key set here.
# EXPLABS_API_KEY env var overrides experiential_api_key set here.

# provider: claude_code (default — runs `claude -p` under your existing
# Claude Code CLI login/subscription, no API key needed), openrouter
# (cloud), local (any OpenAI-compatible server: llama.cpp server, Ollama,
# LM Studio, vLLM, ...), experiential (platform.experientiallabs.ai, a
# curated multi-model gateway on the same OpenAI wire protocol as
# OpenRouter), or opencode_go (runs the `opencode` CLI -- github.com/sst/opencode
# -- under its own separate login/session, no API key needed here either).
# Override per run with `--provider openrouter` / `--provider local` /
# `--provider experiential` / `--provider opencode_go`; --model and
# --workers work the same across all five. If you switch provider without
# also setting model below, config.py picks a provider-appropriate default
# (claude-sonnet-5-5 for claude_code, qwen3.8-27b for experiential, "auto"
# meaning "let opencode pick" for opencode_go, deepseek/deepseek-v3.2
# otherwise) rather than silently reusing whatever model id you had for the
# other provider.
provider: claude_code
# If a call to `provider` fails with an insufficient-credits error (e.g.
# OpenRouter HTTP 402, or Claude Code hitting its own account-level
# session/spend limit), the harness offers to switch engines mid-run rather
# than just failing every remaining chunk: interactively confirmed for a
# manual `--title`/`--titles` run, auto-switched (just logged) for
# unattended `queue` runs. Defaults to opencode_go when `provider` is
# claude_code (a separate binary/session, unaffected by Claude Code's own
# limit), otherwise claude_code; set this to pick a different one, or to
# `provider`'s own value to disable the offer entirely.
# fallback_provider: opencode_go
# Efficient OpenAI subscription fallback (sign in with `codex login`):
# fallback_provider: codex
# fallback_model: gpt-6-luna
# fallback_auto_switch: true
# No `model:` here either, for the same reason -- let it auto-derive.
workers: 2
sequential: true
temperature: 0
max_retries: 5
cache: true
validate: true
repair: true
max_repair_attempts: 2

# Optional hybrid model/provider tiers -- see README.md "Hybrid model
# routing & semantic review" for the full picture. All unset by default:
# everything below uses `model`/`provider` above, exactly as if these
# didn't exist.
#
# complex_model: routes structurally complex chunks (infoboxes, large
# tables, dense reference lists) to a different model at draft time.
# complex_provider only needs setting when it should differ from
# `provider` above; unset, complex chunks just use a different model on
# the same client.
# complex_model: claude-sonnet-5-5
# complex_provider: claude_code
#
# review_model: an independent semantic-fidelity pass over the whole
# assembled article (after structural repair passes clean), looking for
# mistranslation, hallucinated/dropped facts, grammar errors, and
# cross-article transliteration inconsistency -- defects a structural
# validator can't see. Defaults to complex_model when unset (and
# complex_model is set); review_provider defaults to complex_provider,
# then provider. Unresolved findings after review_max_repair_attempts
# don't block delivery -- see review_queue.record_review_flags.
# review_model: claude-sonnet-5-5
# review_provider: claude_code
# review_max_repair_attempts: 2
#
# Full example of the 3-tier "cheap draft, strong complex/review" pattern
# this was designed for -- cheap draft on opencode_go's own separate login,
# stronger model on claude_code for both complex chunks and review (review
# left unset so it inherits complex_model/complex_provider):
#   provider: opencode_go
#   model: opencode-go/deepseek-v4.1-flash   # confirm against `opencode models` -- catalog depends on your own opencode auth
#   complex_model: claude-sonnet-5-5
#   complex_provider: claude_code
#   fallback_provider: claude_code   # auto-switch target if opencode_go hits its own session/rate limit

source_lang: en
target_lang: sq
source_wiki_api: https://en.wikipedia.org/w/api.php

chunk_min_tokens: 1500
chunk_max_tokens: 2500

# Directory (or list of directories) containing SKILL.md for the Pi skill.
# The skill is split across three directories — enwiki-sqwiki-translation
# (translation), wikiterms (terminology/link verification), wikiqa (pre-delivery
# checklist) — that an interactive agent invokes on demand via a Skill tool.
# This harness has no such mechanism, but it also doesn't send all three on
# every request: skill_path (translation + wikiterms) is sent on every
# normal translation/repair call, while qa_skill_path (wikiqa) below is
# loaded separately and only ever appended to a repair call — the one case
# where validate_wikitext has already found a real problem and its
# pre-delivery-checklist content is actually relevant. A single path (just
# translation) also still works, e.g. if you want the harness's own
# verification.py to fully replace wikiterms's role instead of also sending
# the model that skill's text.
skill_path:
  - ~/.claude/skills/enwiki-sqwiki-translation
  - ~/.claude/skills/wikiterms
# Loaded the same way as skill_path but only ever reaches a repair call
# (see build_repair_messages) — never sent on a normal translation call, so
# most sections (which never fail validation) never pay for its tokens.
# Set to null/remove to disable it and rely solely on skill_path's content
# plus the specific validation errors listed during repair.
qa_skill_path: ~/.claude/skills/wikiqa
# On: sqwiki-verified.md's confirmed template names/params reach the model.
# Costs more tokens per request; off falls back to guessing on anything not
# covered by the harness's own live verification (see wiki_translation_harness/verification.py).
include_skill_references: true
# Pin the skill(s) to a committed git revision instead of the working tree, so
# local uncommitted edits in the skill's own repo don't silently change
# translation behavior. Each skill_path directory must be inside a git
# working copy of its repo. Set to null (or remove) to read the live working
# tree instead.
skill_git_ref: HEAD

# Defaults into the shared wiki-translation-queue repo's output/ folder, same
# place wikitranslateautorun/mmtp/wikipedia-articles-translation put theirs.
# Point at a plain local `output` instead if you don't want that.
output_dir: ~/code/wiki-translation-queue/output
cache_db_path: cache/translation_memory.sqlite3
log_dir: logs
stats_path: stats.json

# openrouter_api_key: sk-or-...   # prefer the OPENROUTER_API_KEY env var instead
openrouter_base_url: https://openrouter.ai/api/v1
# Send reasoning: {enabled: false} on OpenRouter calls. Needed for
# reasoning-by-default models (e.g. qwen/qwen3.6-27b) that otherwise spend the
# whole output budget on hidden thinking and time out. Off by default.
# disable_reasoning: true

# Used only when provider: local. Default matches llama.cpp server's
# OpenAI-compatible endpoint (`llama-server -m model.gguf --port 8080`);
# change to point at Ollama (http://localhost:11434/v1), LM Studio
# (http://localhost:1234/v1), vLLM, etc. Most local servers ignore
# local_api_key; some require any non-empty string.
# local_base_url: http://localhost:8080/v1
# local_api_key: local
# local_model: llama-3.1-8b-instruct   # falls back to `model` if unset

# Used only when provider: experiential (platform.experientiallabs.ai).
# experiential_api_key: xpl_...   # prefer the EXPLABS_API_KEY env var instead
# experiential_base_url: https://api.experientiallabs.ai/v1
# experiential_model: qwen3.8-27b   # falls back to `model` if unset

# Used only when provider: claude_code. claude_code_cli_path is the `claude`
# binary to invoke (override if it's not on PATH); claude_code_permission_mode
# is passed straight to `claude -p --permission-mode` (defense in depth —
# every call already runs with --tools "" disabling all tool use, so there's
# nothing for a permission prompt to fire on either way). claude_code_effort
# (low/medium/high/xhigh/max) is passed straight to `claude -p --effort` —
# controls thinking depth/token spend, same knob as the Messages API's
# output_config.effort. Defaults to "medium" (not the CLI's own "high"
# default): this harness's per-chunk translate/repair/review calls are
# short, well-specified, single-section tasks, not long-horizon agentic
# work. Set to null to omit the flag and let the CLI use its own default.
# claude_code_cli_path: claude
# claude_code_permission_mode: bypassPermissions
# claude_code_effort: medium

# Used only when provider: opencode_go. opencode_go_cli_path is the
# `opencode` binary to invoke (override if it's not on PATH). No separate
# opencode_go_model setting -- `model: auto` (the default when you switch to
# this provider without also setting model) means "don't pass --model at
# all, let opencode use its own configured default"; set model to a real
# provider/model id (in opencode's own catalog, not OpenRouter's) to pin one.
# opencode_go_cli_path: opencode
#
# opencode_go_agent: pin `run --agent` to a tools-locked-down agent name.
# Confirmed live that `opencode run` has no `--tools ""` flag the way Claude
# Code's CLI does -- a normal install's default "build" agent can carry
# full bash/file/network permissions, which matters here since chunk text
# is untrusted external wiki content. Define one in opencode's own config
# (opencode.jsonc -- `opencode agent create` is an interactive-only wizard,
# not scriptable) with every tool set to false; see the comment on
# Config.opencode_go_agent in models.py for the exact JSON snippet. Left
# unset (the default), this engine inherits whatever tool permissions
# opencode's own config already grants its default agent.
# opencode_go_agent: wiki-translation-harness

# Sized for the largest oversized-section chunks (never split further, so a
# protected table/template can push a single chunk to 10k+ input tokens) —
# confirmed a real 12k-input/7k-output completion can legitimately take
# over 5 minutes end to end.
request_timeout_s: 600

# Required by Wikimedia's User-Agent policy for automated requests to
# en.wikipedia.org, sq.wikipedia.org, and wikidata.org — an email or URL
# where the operator of this tool can be reached.
# (https://foundation.wikimedia.org/wiki/Policy:User-Agent_policy)
wikimedia_tool_name: wiki-translation-harness
wikimedia_contact: you@example.com

# Harness-side link/template verification against Wikidata + the target
# wiki (see wiki_translation_harness/verification.py) — the harness's own,
# growing equivalent of the skill's sqwiki-verified.md, fed into each
# chunk's translation request as pre-checked facts instead of the model
# having to guess. Persisted in verification_db_path across runs.
verify_links: true
verification_db_path: cache/verified_facts.sqlite3
wikidata_timeout_s: 20
verification_timeout_s: 60
generate_reports: true

# Whole-article checks on the assembled article: static (validator.py —
# malformed {{convert}} args, {{harvc}} usage, unsupported Sfn |text=,
# wikitable rowspan/colspan mismatches, plus the existing structural
# checks) always run; live_validate additionally renders the article via
# the target wiki's action=parse API (see live_validator.py) to catch Lua
# errors, Cite errors (including an orphaned named ref), templates that
# don't exist, and leaked raw {{flagicon}}/{{flag}} "Country data ..."
# text — defects that don't show up in raw wikitext at all. On failure,
# the harness re-prompts the model with only the affected chunk(s) and
# their specific findings, re-validates, up to max_assembly_repair_rounds
# — if issues remain after that, the article is written to
# needs_human_review.json + {title}.review.md in output_dir instead of
# being saved. Independent of max_repair_attempts, which governs the
# separate per-chunk structural/degenerate-repetition repair loop that
# runs before assembly.
live_validate: true
live_validate_timeout_s: 30
max_assembly_repair_rounds: 3
assembly_repair_concurrency: 4  # chunks repaired in parallel per round

# Fills any citation missing |language= in the final assembled article, and
# renames citation parameter *names* mistranslated into the target language
# back to English CS1 equivalents (|titulli= -> |title=, etc). Also
# reconciles {{sfn}}/{{harvnb}} calls whose |ps= quote diverged because the
# same source citation was split across independently-translated chunks.
# See wiki_translation_harness/citation_language.py.
fill_citation_languages: true
max_citation_url_fetches: 40
citation_fetch_concurrency: 5
citation_fetch_timeout_s: 10
citation_fill_timeout_s: 60
fix_citation_param_names: true
dedupe_short_footnotes: true

# Article-level limits to skip articles that take too long or consume too many tokens.
# Timeout for translation phase only (fetching, verification, and post‑processing are
# separately bounded by request_timeout_s, verification_timeout_s, citation_fill_timeout_s).
article_timeout_s: 3600  # 1 hour per article (with workers=4 + openrouter's true concurrency)

# Maximum allowed ratio of output tokens to input tokens per article.
# A ratio > 1 is expected (translation often expands text), but extremely high ratios
# suggest a runaway generation (e.g., the model started repeating or hallucinating).
# Set to 0 to disable.
max_token_ratio: 5.0

# Maximum total tokens (input + output) allowed per article. Zero means unlimited.
max_article_tokens: 0
